# General
editor = "nvim"

# CLI behavior
interactive_default = false
# default_flags = "-m"
# empty_dir_message = "empty dir"

# Display options
show_header = true
show_border = true
show_type = true
show_size = true
show_modified = true
show_icons = true
show_permissions = false
show_bottom_header_for_large_returns = true
always_show_bottom_header = false
directories_first = false

# Colors
# Colors support named, numeric, or hex values (ex: 7, 13, "#ff8800").
headings = "15"
primary = "02"
secondary = "06"
text = "07"
text_highlight = "06"
description_highlight = "05"
tags = "13"
flags = "12"
muted = "08"
border = "08"

# Listing colors
dir_color = "12"
file_color = "07"
type_color = "08"
permissions_color = "08"

# Modified age colors (mod_newer < 1h, mod_new < 1d, mod_old < 1w, mod_older < 4w)
mod_newer_color = "10"
mod_new_color = "02"
mod_old_color = "03"
mod_older_color = "04"
# modified_color = "08"  # overrides all mod colors when set

# File size colors (file_sm < 10KB, file_md < 100KB, file_lg < 1MB, file_xl >= 1MB)
file_sm = "10"
file_md = "02"
file_lg = "03"
file_xl = "04"
# file_size = "08"  # overrides all size colors when set
